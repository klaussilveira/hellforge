app-id: net.darkradiant.DarkRadiant
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: darkradiant

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf

modules:
  - name: eigen
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://gitlab.com/libeigen/eigen/-/archive/3.4.1/eigen-3.4.1.tar.gz
        sha256: b93c667d1b69265cdb4d9f30ec21f8facbbe8b307cf34c0b9942834c6d4fdbe2

  - name: libsigc++
    buildsystem: meson
    config-opts:
      - -Dbuild-examples=false
      - -Dbuild-tests=false
      - -Dbuild-documentation=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsigc++/2.12/libsigc++-2.12.1.tar.xz
        sha256: a9dbee323351d109b7aee074a9cb89ca3e7bcf8ad8edef1851f4cf359bd50843

  - name: glew
    buildsystem: simple
    build-commands:
      - make GLEW_PREFIX=/app GLEW_DEST=/app LIBDIR=/app/lib -j$FLATPAK_BUILDER_N_JOBS
      - make GLEW_PREFIX=/app GLEW_DEST=/app LIBDIR=/app/lib install
    sources:
      - type: archive
        url: https://github.com/nigels-com/glew/releases/download/glew-2.3.1/glew-2.3.1.tgz
        sha256: b64790f94b926acd7e8f84c5d6000a86cb43967bd1e688b03089079799c9e889

  - name: glu
    buildsystem: meson
    config-opts:
      - -Dgl_provider=gl
    sources:
      - type: archive
        url: https://archive.mesa3d.org/glu/glu-9.0.3.tar.xz
        sha256: bd43fe12f374b1192eb15fe20e45ff456b9bc26ab57f0eee919f96ca0f8a330f

  - name: ftgl
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/frankheckenbach/ftgl.git
        commit: 1f2b47428ec6a6452a3be5c7a916b94c65df80ce

  - name: libgit2
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTS=OFF
      - -DUSE_SSH=OFF
    sources:
      - type: archive
        url: https://github.com/libgit2/libgit2/archive/refs/tags/v1.8.5.tar.gz
        sha256: ec70049b8af823b21032447f91a2274fd8d91c435ef326a533dff3824e21b27f

  - name: openal-soft
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DALSOFT_EXAMPLES=OFF
      - -DALSOFT_UTILS=OFF
      - -DALSOFT_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/kcat/openal-soft/archive/refs/tags/1.25.1.tar.gz
        sha256: 5f8efe8dfba5e9307a50251ba615ace857c7fa9dddfe34130b83e213d7f7cf24

  - name: freealut
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/vancegroup/freealut/archive/refs/tags/freealut_1_1_0.tar.gz
        sha256: c3880d7dbb90c7db54e1d6b88aa0a34dd9e2d828fd389be0d2cbb2632b0885dd
      - type: shell
        commands:
          - autoreconf -fi

  - name: wxwidgets
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --with-gtk=3 --disable-debug --enable-unicode
        --with-opengl --without-libtiff --disable-sdltest --disable-webview
      - make -j$FLATPAK_BUILDER_N_JOBS
      - make install
    cleanup:
      - /bin/wx-config
      - /bin/wxrc*
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /lib/wx
      - /share/aclocal
      - /share/bakefile
    sources:
      - type: archive
        url: https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.10/wxWidgets-3.2.10.tar.bz2
        sha256: d66e929569947a4a5920699539089a9bda83a93e5f4917fb313a61f0c344b896

  - name: darkradiant
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_RELOCATION=ON
    sources:
      - type: dir
        path: ..
    post-install:
      - mv /app/share/applications/darkradiant.desktop
        /app/share/applications/net.darkradiant.DarkRadiant.desktop
      - sed -i 's|Exec=.*/darkradiant|Exec=darkradiant|'
        /app/share/applications/net.darkradiant.DarkRadiant.desktop
