name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    uses: ./.github/workflows/linux.yml

  windows:
    uses: ./.github/workflows/windows.yml

  appimage:
    uses: ./.github/workflows/appimage.yml

  flatpak:
    uses: ./.github/workflows/flatpak.yml

  publish:
    name: Publish nightly
    needs: [linux, windows, appimage, flatpak]
    if: ${{ always() && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.flatpak.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package artifacts
        run: |
          cd artifacts

          tar czf hellforge-nightly-linux-x86_64.tar.gz -C hellforge-linux-x86_64 .

          cd hellforge-windows-x64
          zip -r ../hellforge-nightly-windows-x64.zip .
          cd ..

          if [ -d hellforge-appimage-x86_64 ]; then
            cp hellforge-appimage-x86_64/*.AppImage hellforge-nightly-x86_64.AppImage
          fi

          cp hellforge-flatpak-x86_64/hellforge.flatpak hellforge-nightly-x86_64.flatpak

      - name: Generate commit summary
        id: changelog
        run: |
          prev=$(git rev-parse --verify --quiet nightly^{commit} || true)
          {
            echo "changelog<<COMMITS_EOF"
            if [ -n "$prev" ] && [ "$prev" != "$(git rev-parse HEAD)" ]; then
              echo "**Changes since last nightly:**"
              echo
              git log --no-merges --pretty=format:'- %h %s' "$prev"..HEAD
              echo
            else
              echo "**Changes since last nightly:** none"
            fi
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Delete existing nightly release
        run: gh release delete nightly --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create nightly release
        run: |
          files=(
            artifacts/hellforge-nightly-linux-x86_64.tar.gz
            artifacts/hellforge-nightly-windows-x64.zip
            artifacts/hellforge-nightly-x86_64.flatpak
          )
          if [ -f artifacts/hellforge-nightly-x86_64.AppImage ]; then
            files+=(artifacts/hellforge-nightly-x86_64.AppImage)
          fi
          gh release create nightly \
            --prerelease \
            --title "Nightly Build" \
            --notes "Automated nightly build from \`master\` ($(date -u '+%Y-%m-%d %H:%M UTC')).

          **Warning:** These builds are untested and may be unstable.

          ${CHANGELOG}" \
            "${files[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
